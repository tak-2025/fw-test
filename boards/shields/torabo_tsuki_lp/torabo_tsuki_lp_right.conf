CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

CONFIG_ZMK_KEYBOARD_NAME="XS-torabo-tsuki"
CONFIG_TORABO_RESERVED_LAYERS=10
# 回転デバイスの申告（FW からは検出できない＝ビルダーしか知らない情報）。
# 0=不明 / 1=エンコーダ(EC11) / 2=ダイヤル。CPR は「1回転あたりカウント数」（表示用）。
# ドライバ自身の CONFIG（ZMK_HIRES_DIAL / _SCROLL / _RADIAL_CONTROLLER / ZMK_POINTING）は
# 構成によらず同じなので snippet 側が持つ。ここで重ねて出さない。
# センサー0 = 左標準FFCダイヤル
CONFIG_ZMK_ENCODER_CONFIG_SENSOR0_KIND=2
CONFIG_ZMK_ENCODER_CONFIG_SENSOR0_CPR=1275
# 拡張LEDの実在（Studio はこれを見てタブと左右を出し分ける）
CONFIG_ZMK_LED_CONFIG_LEFT_PRESENT=y
CONFIG_ZMK_LED_CONFIG_RIGHT_PRESENT=y
CONFIG_ZMK_LED_CONFIG_CENTRAL_IS_LEFT=n
# モジュール構成の宣言（Studio の FW情報タブ用。0=不明のままでも動作に影響なし）
CONFIG_TORABO_CENTRAL_SIDE=2
CONFIG_TORABO_SLOT_LEFT_STD=4
CONFIG_TORABO_SLOT_LEFT_EXT=2
CONFIG_TORABO_SLOT_RIGHT_STD=1
CONFIG_TORABO_SLOT_RIGHT_EXT=3
# Studio に見せるデバイス素性（0 = 不明 → Studio 側は「デバイス N」表示にフォールバック）
# dev0 = 相手側の reg0 / dev1 = central の拡張パッド / dev2 = 相手側の reg1（2台目）
CONFIG_ZMK_TRACKPAD_CONFIG_DEV0_META=25
CONFIG_ZMK_TRACKPAD_CONFIG_DEV1_META=0
CONFIG_ZMK_TRACKPAD_CONFIG_DEV2_META=0